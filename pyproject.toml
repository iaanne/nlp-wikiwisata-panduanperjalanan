[project]
name = "wikiwisata"
version = "0.1.0"
description = "Asisten rencana perjalanan berbasis RAG dengan evaluasi B0-B6"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate",
  "bitsandbytes",
  "datasets",
  "jsonschema",
  "pandas",
  "peft",
  "pyyaml",
  "rank-bm25",
  "scikit-learn",
  "sentence-transformers",
  "torch",
  "transformers",
  "trl",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiwisata"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
